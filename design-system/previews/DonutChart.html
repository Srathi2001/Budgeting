<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><meta charset="utf-8"><title>Donut chart</title>
<style>body{margin:0;padding:16px;background:var(--ground)}</style></head>
<body>
<div class="anh">
<section class="anh-card">
  <header class="anh-card__head">
    <div><h2 class="anh-card__title">Budget consumption</h2><p class="anh-card__sub">AED M · FY 2026</p></div>
  </header>
  <div class="anh-card__body">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px"><ul class="anh-legend"><li><i class="m-actual"></i>Spent <b>85.4</b></li><li><i class="m-committed"></i>Committed <b>12.6</b></li><li><i class="so"></i>Available <b>12.8</b></li></ul><ul class="anh-legend"><li><i class="ct-labour"></i>Labour <b>38%</b></li><li><i class="ct-materials"></i>Materials <b>27%</b></li><li><i class="ct-plant"></i>Plant &amp; fleet <b>15%</b></li><li><i class="ct-overheads"></i>Overheads <b>11%</b></li><li><i class="ct-other"></i>Other <b>9%</b></li></ul></div>
    <svg class="anh-chart" viewBox="0 0 640 260" role="img" aria-label="Budget consumption and opex by category">
    <path class="m-actual gap" d="M130.00,26.00 A104,104 0 1 1 26.88,116.47 L58.61,120.64 A72,72 0 1 0 130.00,58.00Z"><title>Spent: 77%</title></path>
    <path class="m-committed gap" d="M26.88,116.47 A104,104 0 0 1 60.97,52.22 L82.21,76.15 A72,72 0 0 0 58.61,120.64Z"><title>Committed (PO): 11%</title></path>
    <path class="so gap" d="M60.97,52.22 A104,104 0 0 1 130.00,26.00 L130.00,58.00 A72,72 0 0 0 82.21,76.15Z"><title>Available: 12%</title></path>
    <text class="big" x="130" y="134" text-anchor="middle">77.1%</text><text x="130" y="154" text-anchor="middle">consumed</text>
    <path class="ct-labour gap" d="M420.00,26.00 A104,104 0 0 1 491.19,205.81 L469.29,182.49 A72,72 0 0 0 420.00,58.00Z"><title>Labour: 38%</title></path>
    <path class="ct-materials gap" d="M491.19,205.81 A104,104 0 0 1 335.86,191.13 L361.75,172.32 A72,72 0 0 0 469.29,182.49Z"><title>Materials: 27%</title></path>
    <path class="ct-plant gap" d="M335.86,191.13 A104,104 0 0 1 321.09,97.86 L351.52,107.75 A72,72 0 0 0 361.75,172.32Z"><title>Plant &amp; fleet: 15%</title></path>
    <path class="ct-overheads gap" d="M321.09,97.86 A104,104 0 0 1 364.27,42.19 L381.42,69.21 A72,72 0 0 0 351.52,107.75Z"><title>Overheads: 11%</title></path>
    <path class="ct-other gap" d="M364.27,42.19 A104,104 0 0 1 420.00,26.00 L420.00,58.00 A72,72 0 0 0 381.42,69.21Z"><title>Other: 9%</title></path>
    <text class="big" x="420" y="134" text-anchor="middle">152.2</text><text x="420" y="154" text-anchor="middle">AED M opex</text></svg>
  </div>
</section>
</div>
</body>
</html>
