<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><meta charset="utf-8"><title>100% stacked bar</title>
<style>body{margin:0;padding:16px;background:var(--ground)}</style></head>
<body>
<div class="anh">
<section class="anh-card">
  <header class="anh-card__head">
    <div><h2 class="anh-card__title">Cost structure</h2><p class="anh-card__sub">% of opex · FY 2027</p></div>
  </header>
  <div class="anh-card__body">
    <ul class="anh-legend" style="margin-bottom:10px"><li><i class="ct-labour"></i>Labour</li><li><i class="ct-materials"></i>Materials</li><li><i class="ct-plant"></i>Plant &amp; fleet</li><li><i class="ct-overheads"></i>Overheads</li></ul>
    <svg class="anh-chart" viewBox="0 0 640 242" role="img" aria-label="Cost structure, percent">
    <line class="grid" x1="96.0" x2="96.0" y1="4" y2="220"/><text x="96.0" y="236" text-anchor="middle">0%</text>
    <line class="grid" x1="230.0" x2="230.0" y1="4" y2="220"/><text x="230.0" y="236" text-anchor="middle">25%</text>
    <line class="grid" x1="364.0" x2="364.0" y1="4" y2="220"/><text x="364.0" y="236" text-anchor="middle">50%</text>
    <line class="grid" x1="498.0" x2="498.0" y1="4" y2="220"/><text x="498.0" y="236" text-anchor="middle">75%</text>
    <line class="grid" x1="632.0" x2="632.0" y1="4" y2="220"/><text x="632.0" y="236" text-anchor="middle">100%</text>
    <text x="74" y="26.0" text-anchor="end" style="fill:var(--ink-2)">Contracting</text><rect class="dv-contracting" x="82" y="17" width="10" height="10"/>
    <rect class="ct-labour" x="96.0" y="8" width="233.8" height="28"><title>Contracting · Labour: 44%</title></rect>
    <text class="on-ct-labour" x="104.0" y="26.0">44%</text>
    <rect class="ct-materials" x="331.8" y="8" width="164.2" height="28"><title>Contracting · Materials: 31%</title></rect>
    <text class="on-ct-materials" x="339.8" y="26.0">31%</text>
    <rect class="ct-plant" x="498.0" y="8" width="83.8" height="28"><title>Contracting · Plant &amp; fleet: 16%</title></rect>
    <text class="on-ct-plant" x="506.0" y="26.0">16%</text>
    <rect class="ct-overheads" x="583.8" y="8" width="46.2" height="28"><title>Contracting · Overheads: 9%</title></rect>
    <text class="on-ct-overheads" x="591.8" y="26.0">9%</text>
    <text x="74" y="68.0" text-anchor="end" style="fill:var(--ink-2)">Facilities</text><rect class="dv-facilities" x="82" y="59" width="10" height="10"/>
    <rect class="ct-labour" x="96.0" y="50" width="276.7" height="28"><title>Facilities · Labour: 52%</title></rect>
    <text class="on-ct-labour" x="104.0" y="68.0">52%</text>
    <rect class="ct-materials" x="374.7" y="50" width="94.5" height="28"><title>Facilities · Materials: 18%</title></rect>
    <text class="on-ct-materials" x="382.7" y="68.0">18%</text>
    <rect class="ct-plant" x="471.2" y="50" width="40.9" height="28"><title>Facilities · Plant &amp; fleet: 8%</title></rect>
    <text class="on-ct-plant" x="479.2" y="68.0">8%</text>
    <rect class="ct-overheads" x="514.1" y="50" width="115.9" height="28"><title>Facilities · Overheads: 22%</title></rect>
    <text class="on-ct-overheads" x="522.1" y="68.0">22%</text>
    <text x="74" y="110.0" text-anchor="end" style="fill:var(--ink-2)">Plant hire</text><rect class="dv-plant" x="82" y="101" width="10" height="10"/>
    <rect class="ct-labour" x="96.0" y="92" width="110.6" height="28"><title>Plant hire · Labour: 21%</title></rect>
    <text class="on-ct-labour" x="104.0" y="110.0">21%</text>
    <rect class="ct-materials" x="208.6" y="92" width="73.0" height="28"><title>Plant hire · Materials: 14%</title></rect>
    <text class="on-ct-materials" x="216.6" y="110.0">14%</text>
    <rect class="ct-plant" x="283.6" y="92" width="287.4" height="28"><title>Plant hire · Plant &amp; fleet: 54%</title></rect>
    <text class="on-ct-plant" x="291.6" y="110.0">54%</text>
    <rect class="ct-overheads" x="573.0" y="92" width="57.0" height="28"><title>Plant hire · Overheads: 11%</title></rect>
    <text class="on-ct-overheads" x="581.0" y="110.0">11%</text>
    <text x="74" y="152.0" text-anchor="end" style="fill:var(--ink-2)">Real estate</text><rect class="dv-realestate" x="82" y="143" width="10" height="10"/>
    <rect class="ct-labour" x="96.0" y="134" width="62.3" height="28"><title>Real estate · Labour: 12%</title></rect>
    <text class="on-ct-labour" x="104.0" y="152.0">12%</text>
    <rect class="ct-materials" x="160.3" y="134" width="46.2" height="28"><title>Real estate · Materials: 9%</title></rect>
    <text class="on-ct-materials" x="168.3" y="152.0">9%</text>
    <rect class="ct-plant" x="208.6" y="134" width="30.2" height="28"><title>Real estate · Plant &amp; fleet: 6%</title></rect>
    <rect class="ct-overheads" x="240.7" y="134" width="389.3" height="28"><title>Real estate · Overheads: 73%</title></rect>
    <text class="on-ct-overheads" x="248.7" y="152.0">73%</text>
    <text x="74" y="194.0" text-anchor="end" style="fill:var(--ink-2)">Corporate</text><rect class="dv-corporate" x="82" y="185" width="10" height="10"/>
    <rect class="ct-labour" x="96.0" y="176" width="158.8" height="28"><title>Corporate · Labour: 30%</title></rect>
    <text class="on-ct-labour" x="104.0" y="194.0">30%</text>
    <rect class="ct-materials" x="256.8" y="176" width="24.8" height="28"><title>Corporate · Materials: 5%</title></rect>
    <rect class="ct-plant" x="283.6" y="176" width="14.1" height="28"><title>Corporate · Plant &amp; fleet: 3%</title></rect>
    <rect class="ct-overheads" x="299.7" y="176" width="330.3" height="28"><title>Corporate · Overheads: 62%</title></rect>
    <text class="on-ct-overheads" x="307.7" y="194.0">62%</text>
    </svg>
  </div>
</section>
</div>
</body>
</html>
