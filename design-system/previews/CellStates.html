<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><meta charset="utf-8"><title>Cell states</title>
<style>body{margin:0;padding:16px;background:var(--ground)}</style></head>
<body>
<div class="anh">
<div class="anh-grid-wrap" style="max-width:420px">
<table class="anh-grid anh-grid--report">
  <thead><tr class="h1"><th>State</th><th class="anh-num">Example</th></tr></thead>
  <tbody>
    <tr><td>Editable input</td><td class="anh-num input">1,284,500</td></tr>
    <tr><td>Selected</td><td class="anh-num input is-selected">1,284,500</td></tr>
    <tr><td>Unsaved edit</td><td class="anh-num input is-dirty">1,310,000</td></tr>
    <tr><td>Validation error</td><td class="anh-num input is-error">-40,000</td></tr>
    <tr><td>Locked actual</td><td class="anh-num locked">1,192,040</td></tr>
    <tr><td>Calculated</td><td class="anh-num calc">92,460</td></tr>
    <tr class="subtotal"><td>Subtotal</td><td class="anh-num">12,904,220</td></tr>
    <tr class="total"><td>Grand total</td><td class="anh-num">57,700,000</td></tr>
  </tbody>
</table>
</div>
</div>
</body>
</html>
