<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><meta charset="utf-8"><title>Status tag</title>
<style>body{margin:0;padding:16px;background:var(--ground)}</style></head>
<body>
<div class="anh">
<div style="display:grid;gap:16px">
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <span class="anh-tag anh-tag--approved">Approved</span>
    <span class="anh-tag anh-tag--review">In review</span>
    <span class="anh-tag anh-tag--draft">Draft</span>
    <span class="anh-tag anh-tag--locked">Locked</span>
    <span class="anh-tag anh-tag--rejected">Returned</span>
  </div>
  <div style="display:flex;gap:24px;flex-wrap:wrap;font-size:13px">
    <span class="anh-var anh-var--down">-4.2%</span>
    <span class="anh-var anh-var--up is-adverse">+6.8%</span>
    <span class="anh-var anh-var--up is-adverse is-breach">+14.1%</span>
  </div>
</div>
</div>
</body>
</html>
